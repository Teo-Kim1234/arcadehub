<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris - Arcade Hub</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;900&display=swap" rel="stylesheet">
  <style>
    /* Add a back button for standalone if needed, but the hub handles it */
    body {
        margin: 0;
        overflow: hidden;
        background: transparent !important; /* Let the hub background show through if needed */
    }
    #app {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .screen {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
    }
    .screen.active {
        display: flex;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Main Screen -->
    <div id="main-screen" class="screen active">
      <div class="logo-container">
        <div class="scanline"></div>
        <h1 class="tetris-logo">TETRIS</h1>
      </div>
      <div class="mode-selector">
        <button id="prev-mode" class="nav-btn">◀</button>
        <div class="carousel-viewport">
          <div id="mode-track" class="carousel-track">
            <!-- 연습모드 -->
            <div class="mode-card active" data-mode="practice">
              <div class="card-content">
                <div class="card-icon">🎮</div>
                <div>
                  <h3 class="card-title">연습모드</h3>
                  <p class="card-desc">혼자서 자유롭게 실력을 연마하세요.</p>
                </div>
              </div>
            </div>
            <!-- 일반모드 -->
            <div class="mode-card" data-mode="normal">
              <div class="card-content">
                <div class="card-icon">🏆</div>
                <div>
                  <h3 class="card-title">일반모드</h3>
                  <p class="card-desc">표준 규칙으로 고득점에 도전하세요!</p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <button id="next-mode" class="nav-btn">▶</button>
      </div>
      <div class="tutorial-btn-container">
        <button id="btn-tutorial" class="btn-tutorial">Tutorial</button>
      </div>
    </div>

    <!-- Tutorial Modal -->
    <div id="tutorial-modal" class="modal-overlay">
      <div class="tutorial-modal">
        <button id="modal-close" class="modal-close">&times;</button>
        <div class="tutorial-content">
          <h2>HOW TO PLAY</h2>
          
          <h3>🎮 연습모드 (PRACTICE)</h3>
          <p>테트리스의 기본을 익히는 모드입니다.</p>
          <p><span class="highlight">'a' 키</span>를 누르면 상태를 되돌릴 수 있습니다.</p>
          
          <h3>🏆 일반모드 (NORMAL)</h3>
          <p>정식 규칙으로 고득점에 도전하는 기본 모드입니다.</p>
          
          <div style="margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;">
            <p><strong>CONTROLS:</strong> ← → 방향키 (이동), ↑ (회전), ↓ (하강), SPACE (즉시 하강)</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
      <div class="game-container" style="display: flex; gap: 40px; align-items: flex-start;">
        <div class="game-info-left">
          <div class="glass-panel" style="width: 150px; padding: 20px;">
            <h3>HOLD</h3>
            <canvas id="hold-canvas" width="100" height="100"></canvas>
          </div>
        </div>
        
        <div class="board-wrapper" style="position: relative; border: 4px solid var(--neon-blue); box-shadow: 0 0 30px rgba(0, 212, 255, 0.3); border-radius: 4px;">
          <canvas id="tetris-canvas" width="300" height="600"></canvas>
        </div>

        <div class="game-info-right" style="display: flex; flex-direction: column; gap: 20px;">
          <div class="glass-panel" style="width: 150px; padding: 20px;">
            <h3>NEXT</h3>
            <canvas id="next-canvas" width="100" height="100"></canvas>
          </div>
          <div class="glass-panel" style="width: 150px; padding: 20px;">
            <h3>SCORE</h3>
            <div id="score-val" style="font-size: 24px; font-weight: bold; color: var(--neon-blue);">0</div>
          </div>
          <div class="glass-panel" style="width: 150px; padding: 20px;">
            <h3>LEVEL</h3>
            <div id="level-val" style="font-size: 24px; font-weight: bold; color: var(--neon-blue);">1</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Fail Screen -->
    <div id="fail-screen" class="screen">
      <div class="glass-panel" style="text-align: center; padding: 40px; width: 300px; border: 2px solid #ff3e3e; background: rgba(0,0,0,0.8); border-radius: 20px; backdrop-filter: blur(10px);">
        <h1 style="color: #ff3e3e; font-size: 3rem; margin-bottom: 0;">FAILED</h1>
        <p style="font-size: 1.2rem; margin: 10px 0; color: #fff;">최종 점수: <span id="final-score-val" style="font-weight: bold; color: #00d4ff;">0</span></p>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
          <button onclick="location.reload()" style="background: #00d4ff; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">다시 도전</button>
          <button onclick="window.parent.history.back()" style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">허브로 돌아가기</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
