<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - Arcade Hub</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --tile-bg: rgba(255, 255, 255, 0.05);
            --tile-2: #eee4da;
            --tile-4: #ede0c8;
            --tile-8: #f2b179;
            --tile-16: #f59563;
            --tile-32: #f67c5f;
            --tile-64: #f65e3b;
            --tile-128: #edcf72;
            --tile-256: #edcc61;
            --tile-512: #edc850;
            --tile-1024: #edc53f;
            --tile-2048: #edc22e;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 400px;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .score-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
        }
        .score-label { font-size: 0.8rem; color: #a0a0b0; }
        .score-val { font-size: 1.5rem; font-weight: bold; }

        .grid {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            position: relative;
        }
        .cell {
            width: 85px;
            height: 85px;
            background: var(--tile-bg);
            border-radius: 5px;
        }
        .tile {
            position: absolute;
            width: 85px;
            height: 85px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: #776e65;
            transition: transform 0.15s ease-in-out, background 0.15s;
            z-index: 2;
        }
        .tile-new { animation: appear 0.2s ease; }
        @keyframes appear { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }

        .tile-2 { background: #eee4da; }
        .tile-4 { background: #ede0c8; }
        .tile-8 { background: #f2b179; color: #fff; }
        .tile-16 { background: #f59563; color: #fff; }
        .tile-32 { background: #f67c5f; color: #fff; }
        .tile-64 { background: #f65e3b; color: #fff; }
        .tile-128 { background: #edcf72; color: #fff; font-size: 1.5rem; }
        .tile-256 { background: #edcc61; color: #fff; font-size: 1.5rem; }
        .tile-512 { background: #edc850; color: #fff; font-size: 1.5rem; }
        .tile-1024 { background: #edc53f; color: #fff; font-size: 1.2rem; }
        .tile-2048 { background: #edc22e; color: #fff; font-size: 1.2rem; box-shadow: 0 0 20px rgba(237, 194, 46, 0.5); }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            display: none;
        }
        #overlay.active { display: flex; }
        button {
            padding: 10px 20px;
            background: #edc22e;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="header">
            <h1>2048</h1>
            <div class="score-box">
                <div class="score-label">점수</div>
                <div id="score" class="score-val">0</div>
            </div>
        </div>
        <div id="grid" class="grid">
            <!-- Background cells -->
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
        <div id="overlay">
            <h1 style="color: #ff3e3e; font-size: 3rem; margin-bottom: 0;">FAILED</h1>
            <p style="font-size: 1.5rem; margin: 10px 0;">점수: <span id="final-score">0</span></p>
            <div style="display: flex; gap: 10px;">
                <button onclick="resetGame()">다시 하기</button>
                <button onclick="window.parent.history.back()" style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);">돌아가기</button>
            </div>
        </div>
    </div>

    <script>
        const gridContainer = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const statusEl = document.getElementById('status');

        let grid = Array(16).fill(null); // Each entry: { value, id, mergedFrom? }
        let score = 0;
        let nextId = 1;

        function init() {
            grid = Array(16).fill(null);
            score = 0;
            nextId = 1;
            document.querySelectorAll('.tile').forEach(t => t.remove());
            addRandom();
            addRandom();
            updateUI();
        }

        function addRandom() {
            const empty = grid.map((v, i) => v === null ? i : -1).filter(v => v !== -1);
            if (empty.length === 0) return;
            const idx = empty[Math.floor(Math.random() * empty.length)];
            grid[idx] = { value: Math.random() < 0.9 ? 2 : 4, id: nextId++ };
        }

        function updateUI() {
            const currentTiles = document.querySelectorAll('.tile');
            const tileIdsInGrid = grid.filter(v => v !== null).map(v => v.id);
            
            // Remove tiles no longer in grid (after transition)
            currentTiles.forEach(tile => {
                const id = parseInt(tile.dataset.id);
                if (!tileIdsInGrid.includes(id) && !tile.classList.contains('merging')) {
                    tile.remove();
                }
            });

            grid.forEach((tileData, i) => {
                if (tileData === null) return;

                let tile = document.querySelector(`.tile[data-id="${tileData.id}"]`);
                if (!tile) {
                    tile = document.createElement('div');
                    tile.dataset.id = tileData.id;
                    tile.className = `tile tile-${tileData.value} tile-new`;
                    tile.textContent = tileData.value;
                    gridContainer.appendChild(tile);
                } else {
                    tile.className = `tile tile-${tileData.value}`;
                    tile.textContent = tileData.value;
                }

                const row = Math.floor(i / 4);
                const col = i % 4;
                tile.style.transform = `translate(${col * 95 + 10}px, ${row * 95 + 10}px)`;
            });

            scoreEl.textContent = score;
            
            if (window.parent && window.parent.updateHighScore) {
                window.parent.updateHighScore('2048', score);
            }
        }

        function move(dir) {
            let hasChanged = false;
            let mergedThisTurn = false;
            
            // Helper to slide/merge a single line
            function processLine(line) {
                let newLine = line.filter(v => v !== null);
                for (let i = 0; i < newLine.length - 1; i++) {
                    if (newLine[i].value === newLine[i+1].value) {
                        const mergedVal = newLine[i].value * 2;
                        score += mergedVal;
                        // Mark for removal later or just update
                        newLine[i] = { value: mergedVal, id: newLine[i].id }; // Keep the ID of the first one
                        newLine.splice(i+1, 1);
                        mergedThisTurn = true;
                        hasChanged = true;
                    }
                }
                while (newLine.length < 4) newLine.push(null);
                return newLine;
            }

            const getIdx = (r, c) => r * 4 + c;

            if (dir === 'left' || dir === 'right') {
                for (let r = 0; r < 4; r++) {
                    let row = [grid[getIdx(r, 0)], grid[getIdx(r, 1)], grid[getIdx(r, 2)], grid[getIdx(r, 3)]];
                    if (dir === 'right') row.reverse();
                    
                    let processed = processLine(row);
                    if (dir === 'right') processed.reverse();
                    
                    for (let c = 0; c < 4; c++) {
                        const oldId = grid[getIdx(r, c)] ? grid[getIdx(r, c)].id : null;
                        const newId = processed[c] ? processed[c].id : null;
                        if (oldId !== newId || (grid[getIdx(r, c)] && processed[c] && grid[getIdx(r, c)].value !== processed[c].value)) {
                            hasChanged = true;
                        }
                        grid[getIdx(r, c)] = processed[c];
                    }
                }
            } else {
                for (let c = 0; c < 4; c++) {
                    let col = [grid[getIdx(0, c)], grid[getIdx(1, c)], grid[getIdx(2, c)], grid[getIdx(3, c)]];
                    if (dir === 'down') col.reverse();
                    
                    let processed = processLine(col);
                    if (dir === 'down') processed.reverse();
                    
                    for (let r = 0; r < 4; r++) {
                        const oldId = grid[getIdx(r, c)] ? grid[getIdx(r, c)].id : null;
                        const newId = processed[r] ? processed[r].id : null;
                        if (oldId !== newId || (grid[getIdx(r, c)] && processed[r] && grid[getIdx(r, c)].value !== processed[r].value)) {
                            hasChanged = true;
                        }
                        grid[getIdx(r, c)] = processed[r];
                    }
                }
            }

            if (hasChanged) {
                if (mergedThisTurn && window.parent && window.parent.playGameSound) {
                    window.parent.playGameSound('merge');
                }
                addRandom();
                updateUI();
                if (checkGameOver()) {
                    document.getElementById('final-score').textContent = score;
                    overlay.classList.add('active');
                }
            }
        }

        function checkGameOver() {
            if (grid.includes(null)) return false;
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const val = grid[r * 4 + c].value;
                    if (c < 3 && val === grid[r * 4 + c + 1].value) return false;
                    if (r < 3 && val === grid[(r + 1) * 4 + c].value) return false;
                }
            }
            return true;
        }

        function resetGame() {
            overlay.classList.remove('active');
            init();
        }

        window.addEventListener('keydown', e => {
            if (overlay.classList.contains('active')) return;
            if (e.key === 'ArrowLeft') move('left');
            if (e.key === 'ArrowRight') move('right');
            if (e.key === 'ArrowUp') move('up');
            if (e.key === 'ArrowDown') move('down');
        });

        init();
    </script>
</body>
</html>
