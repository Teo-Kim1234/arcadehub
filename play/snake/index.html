<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake - Arcade Hub</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a0c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: 'Outfit', sans-serif;
        }
        #game-container {
            position: relative;
            border: 10px solid #2e3b00;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            background: #94af10;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: -40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 800;
            color: #94af10;
        }
        .score-val { color: #fff; }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #overlay.hidden { display: none; }
        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            background: #2e3b00;
            color: #94af10;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.2s;
        }
        button:hover { 
            background: #fff; 
            color: #2e3b00;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui">
            <div>점수: <span id="score" class="score-val">0</span></div>
            <div>최고: <span id="high-score" class="score-val">0</span></div>
        </div>
        <canvas id="snake-canvas" width="400" height="400"></canvas>
        <div id="overlay">
            <div id="start-content">
                <h1>클래식 스네이크</h1>
                <p>방향키를 사용하여 이동하세요</p>
                <button id="btn-start">게임 시작</button>
            </div>
            <div id="fail-content" class="hidden">
                <h1 style="color: #ff3e3e;">FAILED</h1>
                <p>최종 점수: <span id="final-score">0</span></p>
                <button onclick="window.parent.history.back()">허브로 돌아가기</button>
                <button onclick="location.reload()" style="background: transparent; color: #fff; border: 1px solid #fff; margin-left: 10px;">다시 도전</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('snake-canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const btnStart = document.getElementById('btn-start');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = 0;
        let gameLoop = null;

        function draw() {
            // Background (Nokia LCD style)
            ctx.fillStyle = '#94af10';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle Grid
            ctx.strokeStyle = 'rgba(46, 59, 0, 0.05)';
            for(let i=0; i<canvas.width; i+=GRID_SIZE) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Food (Classic Red Apple)
            ctx.fillStyle = '#d30000';
            ctx.shadowBlur = 0; // Remove neon effects
            // Draw a rounded apple-like square
            ctx.fillRect(food.x * GRID_SIZE + 2, food.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);
            // Stem
            ctx.fillStyle = '#2e3b00';
            ctx.fillRect(food.x * GRID_SIZE + GRID_SIZE/2 - 1, food.y * GRID_SIZE, 2, 3);

            // Snake (Blocky Dark Green)
            ctx.shadowBlur = 0;
            snake.forEach((part, index) => {
                ctx.fillStyle = '#2e3b00';
                // Snake segments with a tiny gap for blocky look
                ctx.fillRect(part.x * GRID_SIZE + 1, part.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
                
                // Eyes for the head
                if (index === 0) {
                    ctx.fillStyle = '#94af10';
                    if (dx === 1) { // Right
                        ctx.fillRect(part.x * GRID_SIZE + 14, part.y * GRID_SIZE + 4, 2, 2);
                        ctx.fillRect(part.x * GRID_SIZE + 14, part.y * GRID_SIZE + 14, 2, 2);
                    } else if (dx === -1) { // Left
                        ctx.fillRect(part.x * GRID_SIZE + 4, part.y * GRID_SIZE + 4, 2, 2);
                        ctx.fillRect(part.x * GRID_SIZE + 4, part.y * GRID_SIZE + 14, 2, 2);
                    } else if (dy === 1) { // Down
                        ctx.fillRect(part.x * GRID_SIZE + 4, part.y * GRID_SIZE + 14, 2, 2);
                        ctx.fillRect(part.x * GRID_SIZE + 14, part.y * GRID_SIZE + 14, 2, 2);
                    } else { // Up
                        ctx.fillRect(part.x * GRID_SIZE + 4, part.y * GRID_SIZE + 4, 2, 2);
                        ctx.fillRect(part.x * GRID_SIZE + 14, part.y * GRID_SIZE + 4, 2, 2);
                    }
                }
            });
        }

        function move() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            
            // Wall collision
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // Self collision
            if (snake.some(part => part.x === head.x && part.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                placeFood();
                if (window.parent && window.parent.playGameSound) {
                    window.parent.playGameSound('eat');
                }
                if (window.parent && window.parent.updateHighScore) {
                    window.parent.updateHighScore('snake', score);
                }
            } else {
                snake.pop();
            }
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * TILE_COUNT),
                y: Math.floor(Math.random() * TILE_COUNT)
            };
            // Don't place food on snake
            if (snake.some(part => part.x === food.x && part.y === food.y)) {
                placeFood();
            }
        }

        function gameOver() {
            clearInterval(gameLoop);
            document.getElementById('start-content').classList.add('hidden');
            document.getElementById('fail-content').classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
            overlay.classList.remove('hidden');
        }

        function update() {
            move();
            draw();
        }

        function startGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 1; dy = 0;
            score = 0;
            scoreEl.textContent = score;
            placeFood();
            overlay.classList.add('hidden');
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 150); // Slower speed (150ms instead of 100ms)
        }

        window.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp': if(dy !== 1) { dx = 0; dy = -1; } break;
                case 'ArrowDown': if(dy !== -1) { dx = 0; dy = 1; } break;
                case 'ArrowLeft': if(dx !== 1) { dx = -1; dy = 0; } break;
                case 'ArrowRight': if(dx !== -1) { dx = 1; dy = 0; } break;
            }
        });

        btnStart.onclick = startGame;

        // Load high score from hub context if possible
        if (window.parent && window.parent.highScores) {
            highScoreEl.textContent = window.parent.highScores.snake || 0;
        }
    </script>
</body>
</html>
