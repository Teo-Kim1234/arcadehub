<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper - Arcade Hub</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0c;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #00f2ff;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        #overlay.active { display: flex; }
        #grid {
            display: grid;
            grid-template-columns: repeat(var(--cols, 10), 30px);
            gap: 2px;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px;
            border-radius: 5px;
            margin: 0 auto;
            max-width: 95vw;
            max-height: 70vh;
            overflow: auto;
        }
        .cell {
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .cell:hover { background: rgba(255, 255, 255, 0.15); }
        .cell.revealed { background: rgba(255, 255, 255, 0.2); cursor: default; }
        .cell.mine { background: #ff3e3e !important; }
        .cell.flagged::after { content: '🚩'; font-size: 0.7rem; }
        
        .n1 { color: #00f2ff; }
        .n2 { color: #00ff9d; }
        .n3 { color: #ff00e5; }
        .n4 { color: #7000ff; }
        .n5 { color: #ff9d00; }
        .n6 { color: #ff3e3e; }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .difficulty-btn {
            padding: 5px 12px;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.05);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 0;
            cursor: pointer;
            border-radius: 5px;
        }
        .difficulty-btn.active {
            background: #00f2ff;
            color: #000;
            border-color: #00f2ff;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #00f2ff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="header">
            <div>지뢰: <span id="mine-count">10</span></div>
            <div id="timer">00:00</div>
        </div>
        <div class="controls">
            <button class="difficulty-btn active" onclick="setDifficulty('beginner')">초급</button>
            <button class="difficulty-btn" onclick="setDifficulty('intermediate')">중급</button>
            <button class="difficulty-btn" onclick="setDifficulty('expert')">고급</button>
        </div>
        <div id="grid"></div>
        <button onclick="init()">게임 재시작</button>

        <div id="overlay">
            <h1 id="status-text" style="font-size: 3rem; margin-bottom: 0;">FAILED</h1>
            <p id="final-info" style="font-size: 1.2rem; margin: 10px 0;">시간: <span id="final-time">0</span>초</p>
            <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: center;">
                <button onclick="init()">다시 하기</button>
                <button onclick="window.parent.history.back()" style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);">돌아가기</button>
            </div>
        </div>
    </div>

    <script>
        const gridEl = document.getElementById('grid');
        const mineCountEl = document.getElementById('mine-count');
        const timerEl = document.getElementById('timer');

        const DIFFICULTIES = {
            beginner: { rows: 10, cols: 10, mines: 10 },
            intermediate: { rows: 16, cols: 16, mines: 40 },
            expert: { rows: 16, cols: 30, mines: 99 }
        };

        let currentDiff = 'beginner';
        let cells = [];
        let revealedCount = 0;
        let isGameOver = false;
        let isFirstMove = true;
        let timer = 0;
        let timerInterval = null;

        function setDifficulty(diff) {
            currentDiff = diff;
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === (diff === 'beginner' ? '초급' : diff === 'intermediate' ? '중급' : '고급')) {
                    btn.classList.add('active');
                }
            });
            init();
        }

        function init() {
            const { rows, cols, mines } = DIFFICULTIES[currentDiff];
            gridEl.innerHTML = '';
            gridEl.style.setProperty('--cols', cols);
            cells = [];
            revealedCount = 0;
            isGameOver = false;
            isFirstMove = true;
            timer = 0;
            clearInterval(timerInterval);
            timerEl.textContent = '00:00';
            document.getElementById('overlay').classList.remove('active');
            
            // Create cells
            for (let i = 0; i < rows * cols; i++) {
                const cell = {
                    idx: i,
                    isMine: false,
                    isRevealed: false,
                    isFlagged: false,
                    neighborMines: 0,
                    el: document.createElement('div')
                };
                cell.el.className = 'cell';
                cell.el.onclick = () => reveal(i);
                cell.el.oncontextmenu = (e) => {
                    e.preventDefault();
                    toggleFlag(i);
                };
                gridEl.appendChild(cell.el);
                cells.push(cell);
            }

            mineCountEl.textContent = mines;
        }

        function placeMines(safeIdx) {
            const { rows, cols, mines } = DIFFICULTIES[currentDiff];
            let placed = 0;
            
            // Define safe zone (clicked cell + neighbors)
            const safeZone = new Set();
            const sr = Math.floor(safeIdx / cols);
            const sc = safeIdx % cols;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = sr + dr, nc = sc + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                        safeZone.add(nr * cols + nc);
                    }
                }
            }

            while (placed < mines) {
                const idx = Math.floor(Math.random() * cells.length);
                if (!cells[idx].isMine && !safeZone.has(idx)) {
                    cells[idx].isMine = true;
                    placed++;
                }
            }

            // Calculate neighbors
            cells.forEach(cell => {
                if (cell.isMine) return;
                const r = Math.floor(cell.idx / cols);
                const c = cell.idx % cols;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr;
                        const nc = c + dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                            if (cells[nr * cols + nc].isMine) cell.neighborMines++;
                        }
                    }
                }
            });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                const m = Math.floor(timer / 60).toString().padStart(2, '0');
                const s = (timer % 60).toString().padStart(2, '0');
                timerEl.textContent = `${m}:${s}`;
            }, 1000);
        }

        function toggleFlag(idx) {
            if (isGameOver || cells[idx].isRevealed) return;
            cells[idx].isFlagged = !cells[idx].isFlagged;
            cells[idx].el.classList.toggle('flagged');
            const flags = cells.filter(c => c.isFlagged).length;
            const { mines } = DIFFICULTIES[currentDiff];
            mineCountEl.textContent = mines - flags;
        }

        function reveal(idx) {
            if (isGameOver || cells[idx].isRevealed || cells[idx].isFlagged) return;

            if (isFirstMove) {
                isFirstMove = false;
                placeMines(idx);
                startTimer();
            }

            const cell = cells[idx];
            cell.isRevealed = true;
            cell.el.classList.add('revealed');

            if (cell.isMine) {
                if (window.parent && window.parent.playGameSound) {
                    window.parent.playGameSound('pop');
                }
                gameOver(false);
                return;
            }

            if (cell.neighborMines > 0) {
                cell.el.textContent = cell.neighborMines;
                cell.el.classList.add(`n${cell.neighborMines}`);
            } else {
                // Flood fill
                const { rows, cols } = DIFFICULTIES[currentDiff];
                const r = Math.floor(idx / cols);
                const c = idx % cols;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr;
                        const nc = c + dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                            reveal(nr * cols + nc);
                        }
                    }
                }
            }

            const { rows, cols, mines } = DIFFICULTIES[currentDiff];
            revealedCount++;
            if (revealedCount === rows * cols - mines) {
                gameOver(true);
            }
        }

        function gameOver(win) {
            isGameOver = true;
            clearInterval(timerInterval);
            cells.forEach(c => {
                if (c.isMine) {
                    c.el.classList.add('mine');
                    c.el.textContent = '💣';
                }
            });
            
            const finalScore = win ? Math.max(0, 1000 - timer) : 0;
            const statusText = document.getElementById('status-text');
            const overlay = document.getElementById('overlay');
            
            document.getElementById('final-time').textContent = timer;
            
            if (win) {
                statusText.textContent = 'SUCCESS!';
                statusText.style.color = '#00ff9d';
                if (window.parent && window.parent.updateHighScore) {
                    window.parent.updateHighScore('minesweeper', finalScore);
                }
            } else {
                statusText.textContent = 'FAILED';
                statusText.style.color = '#ff3e3e';
                if (window.parent && window.parent.playGameSound) {
                    window.parent.playGameSound('over');
                }
            }
            overlay.classList.add('active');
        }

        init();
    </script>
</body>
</html>
